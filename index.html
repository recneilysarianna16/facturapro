<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ari Fashion - Generador de Facturas</title>
  <link rel="icon" type="image/png" sizes="192x192" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            serif: ['Playfair Display', 'Georgia', 'serif']
          }
        }
      }
    }
  </script>
  
  <!-- Tipografías Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet">
  <!-- React 18 & ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone para JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- HTML2Canvas & jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    @media print {
      body {
        background-color: white !important;
        padding: 0 !important;
        margin: 0 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .no-print {
        display: none !important;
      }
      .print-area {
        box-shadow: none !important;
        border-radius: 0 !important;
        margin: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
        padding: 2.5rem !important;
        background-color: white !important;
        color: #1e293b !important;
      }
      @page {
        size: A4;
        margin: 0;
      }
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="antialiased min-h-screen transition-colors duration-300">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef, useEffect } = React;
    const IconSparkles = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path>
      </svg>
    );
    const IconPlus = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path>
      </svg>
    );
    const IconTrash = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
      </svg>
    );
    const IconEye = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
      </svg>
    );
    const IconDownload = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
      </svg>
    );
    const IconFileText = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
      </svg>
    );
    const IconCheckCircle = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
    );
    const IconBuilding = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
      </svg>
    );
    const IconUser = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
      </svg>
    );
    const IconCreditCard = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
      </svg>
    );
    const IconX = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    );
    const IconSun = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
      </svg>
    );
    const IconMoon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
      </svg>
    );
    const IconHistory = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
    );

    function App() {
      const [isPreview, setIsPreview] = useState(false);
      const [isDarkMode, setIsDarkMode] = useState(true);
      const [currency, setCurrency] = useState('USD');
      const [exchangeRate, setExchangeRate] = useState(56.50);
      const [isExporting, setIsExporting] = useState(false);
      const [exportMessage, setExportMessage] = useState('');
      const [logoUrl, setLogoUrl] = useState('');
      const [invoiceNumber, setInvoiceNumber] = useState('0001');
      const [invoiceDate, setInvoiceDate] = useState(new Date().toISOString().split('T')[0]);
      const [dueDate, setDueDate] = useState('');
      const [clientName, setClientName] = useState('');
      const [clientDoc, setClientDoc] = useState('');
      const [clientPhone, setClientPhone] = useState('');
      const [clientAddress, setClientAddress] = useState('');
      const [items, setItems] = useState([
        { id: 1, title: '', description: '', quantity: 1, price: 0 }
      ]);
      const [discountPercent, setDiscountPercent] = useState(0);
      const [notes, setNotes] = useState('');
      const [paymentInfo, setPaymentInfo] = useState('');
      const [savedInvoices, setSavedInvoices] = useState([]);
      const [showHistoryModal, setShowHistoryModal] = useState(false);

      // Cargar historial guardado al iniciar
      useEffect(() => {
        const stored = localStorage.getItem('ari_fashion_invoices');
        if (stored) {
          try {
            const parsed = JSON.parse(stored);
            setSavedInvoices(parsed);
            if (parsed.length > 0) {
              // Sugerir siguiente número de factura
              const lastNum = parseInt(parsed[0].invoiceNumber, 10);
              if (!isNaN(lastNum)) {
                setInvoiceNumber(String(lastNum + 1).padStart(4, '0'));
              }
            }
          } catch(e) { console.error(e); }
        }
      }, []);

      const saveCurrentInvoiceToHistory = () => {
        const currentInvoice = {
          id: Date.now(),
          invoiceNumber,
          invoiceDate,
          clientName: clientName || 'Cliente General',
          totalUSD: calculateSubtotalUSD() * (1 - (Number(discountPercent)||0)/100),
          items,
          dueDate,
          clientDoc,
          clientPhone,
          clientAddress,
          discountPercent,
          notes,
          paymentInfo
        };
        const updated = [currentInvoice, ...savedInvoices.filter(inv => inv.invoiceNumber !== invoiceNumber)].slice(0, 20);
        setSavedInvoices(updated);
        localStorage.setItem('ari_fashion_invoices', JSON.stringify(updated));
      };

      const loadInvoiceFromHistory = (inv) => {
        setInvoiceNumber(inv.invoiceNumber);
        setInvoiceDate(inv.invoiceDate || new Date().toISOString().split('T')[0]);
        setDueDate(inv.dueDate || '');
        setClientName(inv.clientName || '');
        setClientDoc(inv.clientDoc || '');
        setClientPhone(inv.clientPhone || '');
        setClientAddress(inv.clientAddress || '');
        setItems(inv.items || [{ id: 1, title: '', description: '', quantity: 1, price: 0 }]);
        setDiscountPercent(inv.discountPercent || 0);
        setNotes(inv.notes || '');
        setPaymentInfo(inv.paymentInfo || '');
        setShowHistoryModal(false);
      };
      
      const invoiceRef = useRef(null);
      const calculateSubtotalUSD = () => {
        return items.reduce((sum, item) => sum + (Number(item.quantity) * Number(item.price) || 0), 0);
      };
      const subtotalUSD = calculateSubtotalUSD();
      const discountUSD = (subtotalUSD * (Number(discountPercent) || 0)) / 100;
      const totalUSD = subtotalUSD - discountUSD;
      const rate = Number(exchangeRate) || 1;
      const subtotalVES = subtotalUSD * rate;
      const discountVES = discountUSD * rate;
      const totalVES = totalUSD * rate;

      const handleAddItem = () => {
        setItems([...items, { id: Date.now(), title: '', description: '', quantity: 1, price: 0 }]);
      };
      const handleRemoveItem = (id) => {
        if (items.length === 1) return;
        setItems(items.filter(item => item.id !== id));
      };
      const handleItemChange = (id, field, value) => {
        setItems(items.map(item => item.id === id ? { ...item, [field]: value } : item));
      };
      const handleLogoUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setLogoUrl(reader.result);
          reader.readAsDataURL(file);
        }
      };
      const formatUSD = (val) => `$ ${Number(val).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
      const formatVES = (val) => `Bs. ${Number(val).toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
      
      const renderMoney = (amountUSD, amountVES) => {
        if (currency === 'USD') {
          return (
            <div>
              <span className="font-bold">{formatUSD(amountUSD)}</span>
              <div className={`text-[10px] font-normal ${isDarkMode ? 'text-slate-400' : 'text-slate-500'}`}>Eqv: {formatVES(amountVES)}</div>
            </div>
          );
        } else {
          return (
            <div>
              <span className="font-bold">{formatVES(amountVES)}</span>
              <div className={`text-[10px] font-normal ${isDarkMode ? 'text-slate-400' : 'text-slate-500'}`}>Eqv: {formatUSD(amountUSD)}</div>
            </div>
          );
        }
      };

      const prepareCanvasExport = async () => {
        if (!invoiceRef.current) return null;
        if (document.fonts && document.fonts.ready) {
          await document.fonts.ready;
        }
        const canvas = await window.html2canvas(invoiceRef.current, {
          scale: 2,
          useCORS: true,
          allowTaint: true,
          backgroundColor: isDarkMode ? '#090d16' : '#ffffff',
          logging: false
        });
        return canvas;
      };

      const exportAsImage = async () => {
        setIsExporting(true);
        setExportMessage('Generando imagen...');
        try {
          saveCurrentInvoiceToHistory();
          if (!isPreview) {
            setIsPreview(true);
            await new Promise(resolve => setTimeout(resolve, 150));
          }
          const canvas = await prepareCanvasExport();
          if (!canvas) {
            alert("No se pudo encontrar el contenedor de la factura.");
            return;
          }
          const imageUri = canvas.toDataURL('image/png', 1.0);
          const link = document.createElement('a');
          link.download = `Factura_Ari_Fashion_${invoiceNumber || 'SN'}.png`;
          link.href = imageUri;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        } catch (err) {
          console.error('Error al exportar imagen:', err);
          alert('Hubo un error al generar la imagen.');
        } finally {
          setIsExporting(false);
          setExportMessage('');
        }
      };

      const exportAsPDF = async () => {
        setIsExporting(true);
        setExportMessage('Generando PDF...');
        try {
          saveCurrentInvoiceToHistory();
          if (!isPreview) {
            setIsPreview(true);
            await new Promise(resolve => setTimeout(resolve, 150));
          }
          const canvas = await prepareCanvasExport();
          if (!canvas) {
            alert("No se pudo encontrar el contenedor de la factura.");
            return;
          }
          const imgData = canvas.toDataURL('image/png');
          const jsPDFClass = window.jspdf ? window.jspdf.jsPDF : window.jsPDF;
          const pdf = new jsPDFClass('p', 'mm', 'a4');
          
          const pdfWidth = pdf.internal.pageSize.getWidth();
          const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
          pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight > pdf.internal.pageSize.getHeight() ? pdf.internal.pageSize.getHeight() : pdfHeight);
          pdf.save(`Factura_Ari_Fashion_${invoiceNumber || 'SN'}.pdf`);
        } catch (err) {
          console.error('Error al exportar PDF:', err);
          alert('Hubo un error al generar el PDF.');
        } finally {
          setIsExporting(false);
          setExportMessage('');
        }
      };

      return (
        <div className={`min-h-screen flex flex-col transition-colors duration-300 ${isDarkMode ? 'bg-slate-900 text-slate-100' : 'bg-slate-100 text-slate-800'}`}>
          
          {/* ENCABEZADO SUPERIOR */}
          {!isPreview && (
            <header className={`no-print border-b shadow-lg sticky top-0 z-30 transition-colors duration-300 ${isDarkMode ? 'bg-slate-950 border-slate-800' : 'bg-white border-pink-100'}`}>
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap items-center justify-between gap-4">
                <div className="flex items-center space-x-3">
                  <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-pink-500 to-rose-400 flex items-center justify-center text-white shadow-md shadow-pink-950">
                    <IconSparkles />
                  </div>
                  <div>
                    <h1 className={`text-xl font-bold tracking-wider font-serif leading-none ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>
                      ARI FASHION
                    </h1>
                    <p className="text-xs text-pink-500 font-medium tracking-widest uppercase">
                      belleza, moda y estilo
                    </p>
                  </div>
                </div>
                <div className="flex items-center space-x-2 sm:space-x-3 text-xs sm:text-sm">
                  <button
                    onClick={() => setShowHistoryModal(true)}
                    className={`p-2 rounded-lg border transition-all flex items-center space-x-1 ${
                      isDarkMode 
                        ? 'bg-slate-900 border-slate-700 text-pink-400 hover:bg-slate-800' 
                        : 'bg-slate-50 border-slate-200 text-pink-600 hover:bg-slate-200'
                    }`}
                    title="Historial de Facturas"
                  >
                    <IconHistory className="w-4 h-4" />
                    <span className="hidden sm:inline font-medium text-xs">Historial ({savedInvoices.length})</span>
                  </button>
                  <button
                    onClick={() => setIsDarkMode(!isDarkMode)}
                    className={`p-2 rounded-lg border transition-all flex items-center space-x-1.5 ${
                      isDarkMode 
                        ? 'bg-slate-900 border-slate-700 text-amber-400 hover:bg-slate-800' 
                        : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-200'
                    }`}
                    title={isDarkMode ? "Cambiar a Tema Claro" : "Cambiar a Tema Oscuro"}
                  >
                    {isDarkMode ? <IconSun className="w-4 h-4" /> : <IconMoon className="w-4 h-4" />}
                    <span className="hidden sm:inline font-medium text-xs">{isDarkMode ? 'Claro' : 'Oscuro'}</span>
                  </button>
                  <span className={`font-medium hidden md:inline ${isDarkMode ? 'text-slate-400' : 'text-slate-500'}`}>
                    Tasa BCV:
                  </span>
                  <div className={`flex items-center border rounded-lg px-2 py-1 space-x-1 focus-within:ring-2 focus-within:ring-pink-500 ${isDarkMode ? 'bg-slate-900 border-slate-700' : 'bg-slate-50 border-slate-200'}`}>
                    <span className={isDarkMode ? 'text-slate-500 font-semibold' : 'text-slate-400 font-semibold'}>Bs.</span>
                    <input
                      type="number"
                      step="0.01"
                      value={exchangeRate}
                      onChange={(e) => setExchangeRate(e.target.value)}
                      placeholder="56.50"
                      className={`w-20 bg-transparent font-semibold focus:outline-none text-right ${isDarkMode ? 'text-white' : 'text-slate-800'}`}
                    />
                  </div>
                  <div className={`p-1 rounded-lg flex items-center border ${isDarkMode ? 'bg-slate-900 border-slate-700' : 'bg-slate-100 border-slate-200'}`}>
                    <button
                      onClick={() => setCurrency('USD')}
                      className={`px-3 py-1 rounded-md text-xs font-semibold transition-all ${
                        currency === 'USD' ? 'bg-pink-600 text-white shadow-sm' : isDarkMode ? 'text-slate-400 hover:text-white' : 'text-slate-600 hover:text-slate-900'
                      }`}
                    >
                      USD ($)
                    </button>
                    <button
                      onClick={() => setCurrency('VES')}
                      className={`px-3 py-1 rounded-md text-xs font-semibold transition-all ${
                        currency === 'VES' ? 'bg-pink-600 text-white shadow-sm' : isDarkMode ? 'text-slate-400 hover:text-white' : 'text-slate-600 hover:text-slate-900'
                      }`}
                    >
                      Bs. (VES)
                    </button>
                  </div>
                </div>
              </div>
            </header>
          )}

          {/* MODAL DE HISTORIAL */}
          {showHistoryModal && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className={`w-full max-w-lg rounded-2xl p-6 border shadow-2xl space-y-4 max-h-[80vh] overflow-y-auto ${isDarkMode ? 'bg-slate-950 border-slate-800 text-slate-100' : 'bg-white border-slate-200 text-slate-850'}`}>
                <div className="flex items-center justify-between border-b pb-3">
                  <h3 className="text-base font-bold flex items-center space-x-2 text-pink-500">
                    <IconHistory />
                    <span>Facturas Guardadas Recientemente</span>
                  </h3>
                  <button onClick={() => setShowHistoryModal(false)} className="p-1 rounded-lg hover:bg-slate-800">
                    <IconX />
                  </button>
                </div>
                {savedInvoices.length === 0 ? (
                  <p className="text-xs text-slate-400 text-center py-6">No hay facturas guardadas todavía en este navegador.</p>
                ) : (
                  <div className="space-y-2">
                    {savedInvoices.map((inv) => (
                      <div key={inv.id} className={`p-3 rounded-xl border flex items-center justify-between transition ${isDarkMode ? 'bg-slate-900 border-slate-800 hover:border-pink-500' : 'bg-slate-50 border-slate-200 hover:border-pink-300'}`}>
                        <div>
                          <p className="font-bold text-xs">Factura #{inv.invoiceNumber} - {inv.clientName}</p>
                          <p className="text-[10px] text-slate-400">Fecha: {inv.invoiceDate} | Total: ${Number(inv.totalUSD).toFixed(2)}</p>
                        </div>
                        <button
                          onClick={() => loadInvoiceFromHistory(inv)}
                          className="px-3 py-1.5 bg-pink-600 hover:bg-pink-700 text-white font-semibold text-xs rounded-lg transition"
                        >
                          Cargar
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* BARRA SUPERIOR MODO VISTA PREVIA */}
          {isPreview && (
            <div className="no-print bg-slate-950 text-white sticky top-0 z-50 px-3 py-2 shadow-xl border-b border-slate-800">

                  <div className="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-pink-500 flex items-center justify-center text-white font-bold text-sm sm:text-base">
                    A
                  </div>
                  <div>
                    <h1 className={`text-lg sm:text-2xl font-black tracking-widest font-serif leading-none ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>
                      ARI FASHION
                    </h1>
                    <p className="text-[9px] sm:text-[10px] text-pink-500 font-bold tracking-widest uppercase">
                      belleza, moda y estilo
                    </p>
                  </div>
                </div>
              )}
              
              <p className={`text-[9px] sm:text-[10px] leading-relaxed font-light ${isDarkMode ? 'text-slate-400' : 'text-slate-500'}`}>
                Venta de Ropa, Accesorios y bisuteria, en tendencia.<br />
                Envíos a nivel nacional & Atención personalizada.
              </p>
            </div>
            <div className="text-right space-y-0.5 sm:space-y-1">
              <div className="inline-block bg-pink-500/10 text-pink-500 px-2.5 py-0.5 rounded-full font-bold text-xs sm:text-sm tracking-wider uppercase mb-1 border border-pink-500/20">
                FACTURA
              </div>
              <div className={`font-mono font-bold text-sm sm:text-base ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>
                #{invoiceNumber || '0001'}
              </div>
              <div className={`text-[10px] sm:text-[11px] ${isDarkMode ? 'text-slate-400' : 'text-slate-500'}`}>
                <strong>Emisión:</strong> {invoiceDate || 'N/A'}
              </div>
              {dueDate && (
                <div className={`text-[10px] sm:text-[11px] ${isDarkMode ? 'text-slate-400' : 'text-slate-500'}`}>
                  <strong>Vencimiento:</strong> {dueDate}
                </div>
              )}
              <div className={`text-[9px] sm:text-[10px] pt-0.5 ${isDarkMode ? 'text-slate-500' : 'text-slate-400'}`}>
                Tasa Ref: Bs. {Number(exchangeRate).toFixed(2)} / USD
              </div>
            </div>
          </div>

          {/* DATOS DEL CLIENTE */}
          <div className={`py-4 sm:py-6 border-b ${isDarkMode ? 'border-slate-800' : 'border-slate-100'}`}>
            <h3 className="text-[10px] font-bold uppercase tracking-widest text-pink-500 mb-2">
              Facturado a:
            </h3>
            <div className={`grid grid-cols-2 gap-2 sm:gap-4 p-3 sm:p-4 rounded-xl sm:rounded-2xl border items-start ${isDarkMode ? 'bg-slate-900/60 border-slate-800' : 'bg-slate-50/60 border-slate-100'}`}>
              <div>
                <p className={`font-bold text-xs sm:text-sm break-words ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>
                  {clientName || 'Nombre del Cliente'}
                </p>
                <p className={`text-[10px] sm:text-xs mt-0.5 break-words ${isDarkMode ? 'text-slate-300' : 'text-slate-600'}`}>
                  {clientDoc ? `CI/RIF: ${clientDoc}` : 'CI/RIF: Sin especificar'}
                </p>
              </div>
              <div className="text-right">
                <p className={`text-[10px] sm:text-xs break-words ${isDarkMode ? 'text-slate-300' : 'text-slate-600'}`}>
                  {clientPhone || 'Teléfono no registrado'}
                </p>
                <p className={`text-[10px] sm:text-xs break-words whitespace-pre-wrap mt-0.5 leading-tight ${isDarkMode ? 'text-slate-400' : 'text-slate-500'}`}>
                  {clientAddress || 'Dirección de entrega'}
                </p>
              </div>
            </div>
          </div>

          {/* TABLA DE PRODUCTOS */}
          <div className="py-4 sm:py-6 overflow-x-auto">
            <table className="w-full text-left border-collapse min-w-[300px]">
              <thead>
                <tr className={`border-b-2 text-[9px] sm:text-[10px] uppercase tracking-wider ${isDarkMode ? 'border-pink-900/40 text-slate-400' : 'border-pink-100 text-slate-400'}`}>
                  <th className="pb-2 font-bold">Descripción / Producto</th>
                  <th className="pb-2 font-bold text-center w-12 sm:w-16">Cant.</th>
                  <th className="pb-2 font-bold text-right w-20 sm:w-28">P. Unitario</th>
                  <th className="pb-2 font-bold text-right w-24 sm:w-32">Total</th>
                </tr>
              </thead>
              <tbody className={`divide-y ${isDarkMode ? 'divide-slate-800' : 'divide-slate-100'}`}>
                {items.map((item, idx) => {
                  const qty = Number(item.quantity) || 0;
                  const price = Number(item.price) || 0;
                  const itemTotalUSD = qty * price;
                  const itemTotalVES = itemTotalUSD * exchangeRate;
                  return (
                    <tr key={idx} className="group">
                      <td className="py-2.5 pr-2">
                        <p className={`font-bold text-[11px] sm:text-xs ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>
                          {item.title || 'Producto sin título'}
                        </p>
                        {item.description && (
                          <p className={`text-[9px] sm:text-[10px] font-light mt-0.5 ${isDarkMode ? 'text-slate-400' : 'text-slate-500'}`}>
                            {item.description}
                          </p>
                        )}
                      </td>
                      <td className={`py-2.5 text-center font-medium text-[11px] sm:text-xs ${isDarkMode ? 'text-slate-300' : 'text-slate-700'}`}>
                        {qty}
                      </td>
                      <td className={`py-2.5 text-right font-medium text-[11px] sm:text-xs ${isDarkMode ? 'text-slate-300' : 'text-slate-700'}`}>
                        {currency === 'USD' ? `$ ${price.toFixed(2)}` : `Bs. ${(price * exchangeRate).toFixed(2)}`}
                      </td>
                      <td className="py-2.5 text-right">
                        {renderMoney(itemTotalUSD, itemTotalVES)}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>

          {/* TOTALES Y NOTAS FINALES */}
          <div className={`pt-4 flex flex-col sm:grid sm:grid-cols-12 gap-4 sm:gap-6 border-t ${isDarkMode ? 'border-slate-800' : 'border-slate-100'}`}>
            <div className="order-2 sm:order-1 sm:col-span-7 space-y-3 sm:space-y-4">
              {paymentInfo && (
                <div className={`p-2.5 sm:p-3 rounded-xl border ${isDarkMode ? 'bg-pink-950/20 border-pink-900/30' : 'bg-pink-50/50 border-pink-100/60'}`}>
                  <h4 className="text-[9px] sm:text-[10px] font-bold uppercase tracking-wider text-pink-500 mb-1">
                    Métodos de Pago & Cuentas:
                  </h4>
                  <p className={`text-[9px] sm:text-[10px] whitespace-pre-line leading-relaxed ${isDarkMode ? 'text-slate-300' : 'text-slate-600'}`}>
                    {paymentInfo}
                  </p>
                </div>
              )}
              {notes && (
                <div>
                  <h4 className={`text-[9px] sm:text-[10px] font-bold uppercase tracking-wider mb-1 ${isDarkMode ? 'text-slate-400' : 'text-slate-400'}`}>
                    Notas adicionales:
                  </h4>
                  <p className={`text-[9px] sm:text-[10px] italic leading-relaxed ${isDarkMode ? 'text-slate-400' : 'text-slate-500'}`}>
                    {notes}
                  </p>
                </div>
              )}
            </div>
            <div className="order-1 sm:order-2 sm:col-span-5 space-y-2 text-right w-full">
              <div className={`flex justify-between items-center py-0.5 text-xs ${isDarkMode ? 'text-slate-300' : 'text-slate-600'}`}>
                <span>Subtotal:</span>
                <span>{renderMoney(subtotalUSD, subtotalVES)}</span>
              </div>
              {Number(discountPercent) > 0 && (
                <div className="flex justify-between items-center text-pink-500 py-0.5 text-xs">
                  <span>Descuento ({discountPercent}%):</span>
                  <span>- {renderMoney(discountUSD, discountVES)}</span>
                </div>
              )}
              <div className={`p-3 sm:p-4 rounded-xl sm:rounded-2xl shadow-md mt-2 flex items-center justify-between gap-3 w-full border ${isDarkMode ? 'bg-slate-900 border-slate-800 text-white' : 'bg-gradient-to-r from-slate-900 to-slate-800 text-white border-transparent'}`}>
                <span className="text-[10px] sm:text-xs uppercase font-bold tracking-wider text-pink-400 shrink-0">
                  Total a Pagar
                </span>
                <div className="text-right">
                  <div className="text-sm sm:text-base font-black whitespace-nowrap">
                    {currency === 'USD' ? `$ ${totalUSD.toFixed(2)}` : `Bs. ${totalVES.toFixed(2)}`}
                  </div>
                  <div className={`text-[9px] sm:text-[10px] font-light whitespace-nowrap ${isDarkMode ? 'text-slate-400' : 'text-slate-300'}`}>
                    {currency === 'USD' ? `Eqv: Bs. ${totalVES.toFixed(2)}` : `Eqv: $ ${totalUSD.toFixed(2)}`}
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div className={`mt-8 sm:mt-12 pt-4 sm:pt-6 border-t text-center space-y-1 ${isDarkMode ? 'border-slate-800' : 'border-slate-100'}`}>
            <p className={`text-[10px] sm:text-[11px] font-bold tracking-wider ${isDarkMode ? 'text-slate-200' : 'text-slate-800'}`}>
              ¡Gracias por tu compra en Ari Fashion!
            </p>
            <p className={`text-[9px] sm:text-[10px] ${isDarkMode ? 'text-slate-500' : 'text-slate-400'}`}>
              Sigue las tendencias en moda, belleza y estilo.
            </p>
          </div>
        </div>
      );
    });

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
   <!-- MÓDULO DE CATÁLOGO GUARDADO -->
<div id="seccion-catalogo" style="margin: 20px 0; padding: 15px; border: 1px solid #333; border-radius: 8px;">
  <h3 style="color: #4f46e5;">📦 Catálogo de Productos Guardados</h3>
  
  <!-- Formulario para agregar nuevo producto al catálogo -->
  <div style="display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;">
    <input type="text" id="cat-nombre" placeholder="Nombre del producto (ej: Franela)" style="flex: 1; padding: 8px;">
    <input type="number" id="cat-precio" placeholder="Precio ($ USD)" style="width: 120px; padding: 8px;">
    <button onclick="guardarEnCatalogo()" style="background: #4f46e5; color: white; padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer;">
      ➕ Guardar Producto
    </button>
  </div>

  <!-- Lista desplegable para seleccionar y cargar el producto a la factura -->
  <div style="display: flex; gap: 10px; align-items: center;">
    <label>Cargar a la factura:</label>
    <select id="select-catalogo" style="flex: 1; padding: 8px;" onchange="cargarAFormulario()">
      <option value="">-- Selecciona un producto guardado --</option>
    </select>
  </div>
</div>

<script>
// Array para almacenar productos
let catalogoProductos = JSON.parse(localStorage.getItem('mi_catalogo_app')) || [];

// Función para actualizar el selector desplegable
function actualizarSelectCatalogo() {
  const select = document.getElementById('select-catalogo');
  select.innerHTML = '<option value="">-- Selecciona un producto guardado --</option>';
  
  catalogoProductos.forEach((prod, index) => {
    const option = document.createElement('option');
    option.value = index;
    option.textContent = `${prod.nombre} - $${prod.precio}`;
    select.appendChild(option);
  });
}

// Función para guardar un nuevo producto en el catálogo
function guardarEnCatalogo() {
  const nombre = document.getElementById('cat-nombre').value.trim();
  const precio = parseFloat(document.getElementById('cat-precio').value);

  if (!nombre || isNaN(precio)) {
    alert('Por favor ingresa un nombre y un precio válido.');
    return;
  }

  catalogoProductos.push({ nombre, precio });
  localStorage.setItem('mi_catalogo_app', JSON.stringify(catalogoProductos));
  
  document.getElementById('cat-nombre').value = '';
  document.getElementById('cat-precio').value = '';
  
  actualizarSelectCatalogo();
  alert('¡Producto guardado en el catálogo con éxito!');
}

// Función para transferir el producto seleccionado al formulario de venta principal
function cargarAFormulario() {
  const index = document.getElementById('select-catalogo').value;
  if (index === '') return;

  const producto = catalogoProductos[index];

  // NOTA: Reemplaza estos IDs por los IDs exactos que usas en tu formulario de productos
  const inputNombre = document.querySelector('input[placeholder*="Producto"]') || document.querySelector('input[type="text"]');
  const inputPrecio = document.querySelector('input[placeholder*="Precio"]') || document.querySelector('input[type="number"]');

  if (inputNombre) inputNombre.value = producto.nombre;
  if (inputPrecio) inputPrecio.value = producto.precio;
}

// Cargar catálogo existente al abrir la página
document.addEventListener('DOMContentLoaded', actualizarSelectCatalogo);
</script>
